plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.pulse'
version = '1.0.0'

android {
  namespace "app.pulse.bt"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Same client react-native-health-connect uses, for asking which Health Connect features this phone offers.
  implementation "androidx.health.connect:connect-client:1.1.0"
}
